<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>截图金额修改器 · 网页版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: #F4F3EE; color: #1A1B1C; padding: 16px 12px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 600; }
  .sub { font-size: 13px; color: #6B7280; margin: 4px 0 14px; line-height: 1.5; }
  .card {
    background: #fff; border: 1px solid #E4E3DD; border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer; background: #8BC8EA; color: #1A1B1C; font-weight: 600;
    text-decoration: none; text-align: center;
  }
  .btn:active { filter: brightness(0.92); }
  .btn.gray { background: #E4E3DD; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.block { display: block; width: 100%; }
  #fileInput { display: none; }
  .upload-zone {
    border: 2px dashed #C9D4DE; border-radius: 12px; padding: 26px 12px;
    text-align: center; color: #6B7280; font-size: 14px; cursor: pointer; background: #FBFCFD;
  }
  .upload-zone.have { display: none; }
  canvas {
    display: block; width: 100%; border: 1px solid #E4E3DD; border-radius: 10px;
    cursor: crosshair; background: #fff; touch-action: none;
  }
  .hint { font-size: 12px; color: #6B7280; margin-top: 8px; line-height: 1.5; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; }
  .field label { font-size: 12px; color: #6B7280; }
  .field input {
    padding: 9px 10px; border: 1px solid #E4E3DD; border-radius: 10px; font-size: 15px;
    min-width: 0; width: 100%; background: #fff; color: #1A1B1C;
  }
  .amount-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .amount-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border: 1px solid #E4E3DD; border-radius: 10px; font-size: 14px; background: #fff;
  }
  .amount-item.active { border-color: #EA6668; background: rgba(234,102,104,0.06); }
  .amount-item .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(139,200,234,0.2);
    flex-shrink: 0;
  }
  .amount-item .conf { margin-left: auto; font-size: 12px; color: #6B7280; }
  .result-box img {
    display: block; max-width: 100%; border: 1px solid #E4E3DD; border-radius: 10px; margin-top: 8px;
  }
  .status { font-size: 13px; color: #6B7280; margin-top: 10px; line-height: 1.5; min-height: 18px; word-break: break-all; }
  .status.err { color: #EA6668; }
  .status.ok { color: #52C41A; }
  .hidden { display: none !important; }
  #boxInfo { font-size: 12px; color: #6B7280; margin-top: 8px; font-family: Consolas, monospace; word-break: break-all; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row .btn { flex: 1; }
  .bar { height: 4px; background: #E4E3DD; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: #8BC8EA; border-radius: 2px; transition: width .2s; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(26,27,28,.25);
    border-top-color: #1A1B1C; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>截图金额修改器（网页版）</h1>
  <div class="sub">纯浏览器运行，不上传服务器。上传截图 → 自动识别金额 → 填新金额 → 处理下载。首次使用需加载识别引擎（约 10MB，之后有缓存）。</div>

  <div class="card">
    <h2>① 上传截图</h2>
    <div class="upload-zone" id="uploadZone">
      点击选择截图<br><span style="font-size:12px;">支持 APP 界面 / 凭证单据截图</span>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div id="editorArea" class="hidden">
      <canvas id="cv"></canvas>
      <div class="hint">已自动选中金额；可点下方列表切换，或拖动框选。</div>
      <div id="amountArea" class="hidden">
        <div id="amountList" class="amount-list"></div>
      </div>
      <div id="boxInfo">尚未选择目标</div>
      <div class="row">
        <button class="btn gray" id="clearBtn">清除重选</button>
        <button class="btn gray" id="reOcrBtn">重新识别</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>② 填写新金额</h2>
    <div class="form-row">
      <div class="field">
        <label>新金额（如：1234.50）</label>
        <input type="text" id="newValue" placeholder="1,234.50" autocomplete="off">
      </div>
    </div>
    <div class="bar hidden" id="progBar"><div id="progFill"></div></div>
    <div class="status" id="status"></div>
    <button class="btn block" id="submitBtn" style="margin-top:10px;" disabled>处理图片</button>
  </div>

  <div class="card result-box hidden" id="resultCard">
    <h2>③ 处理结果</h2>
    <img id="resultImg" alt="处理结果">
    <div class="row">
      <a class="btn" id="downloadBtn" download="result.png">下载图片</a>
      <button class="btn gray" id="redoBtn">重新修改</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
// CDN 备用源：主源不可用时自动换源加载识别引擎
(function () {
  if (typeof Tesseract !== 'undefined') return;
  var alts = [
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js'
  ];
  var i = 0;
  function load() {
    if (typeof Tesseract !== 'undefined' || i >= alts.length) return;
    var s = document.createElement('script');
    s.src = alts[i++];
    s.onload = function () { if (typeof Tesseract === 'undefined') load(); };
    s.onerror = load;
    document.head.appendChild(s);
  }
  load();
})();
</script>
<script>
(function () {
  'use strict';

  // ---------- DOM ----------
  var uploadZone = document.getElementById('uploadZone');
  var fileInput = document.getElementById('fileInput');
  var editorArea = document.getElementById('editorArea');
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var clearBtn = document.getElementById('clearBtn');
  var reOcrBtn = document.getElementById('reOcrBtn');
  var amountArea = document.getElementById('amountArea');
  var amountList = document.getElementById('amountList');
  var boxInfo = document.getElementById('boxInfo');
  var newValueEl = document.getElementById('newValue');
  var submitBtn = document.getElementById('submitBtn');
  var statusEl = document.getElementById('status');
  var progBar = document.getElementById('progBar');
  var progFill = document.getElementById('progFill');
  var resultCard = document.getElementById('resultCard');
  var resultImg = document.getElementById('resultImg');
  var downloadBtn = document.getElementById('downloadBtn');
  var redoBtn = document.getElementById('redoBtn');

  // ---------- 状态 ----------
  var img = null;            // 原始 HTMLImageElement
  var scale = 1;             // 画布缩放（相对原图）
  var origW = 0, origH = 0;
  var amounts = [];          // OCR 金额候选 [{text, box, conf}]
  var selectedIdx = -1;
  var manualBox = null;      // 手动框选（原图坐标）
  var drawing = null;
  var isDown = false;
  var worker = null;
  var ocrBusy = false;

  // ---------- 工具 ----------
  function $(id) { return document.getElementById(id); }
  function showStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setProgress(p) {
    if (p > 0 && p < 1) { progBar.classList.remove('hidden'); progFill.style.width = (p * 100).toFixed(0) + '%'; }
    else progBar.classList.add('hidden');
  }
  function normalizeAmount(t) {
    var s = String(t).replace(/[¥￥$,\s元块钱]/g, '').trim();
    if (/^\d+\.$/.test(s)) s = s.slice(0, -1);
    return s;
  }
  function isAmount(t) {
    var s = normalizeAmount(t);
    return /^\d+(?:\.\d+)?$/.test(s);
  }
  // 合并过程中的宽松判断：允许带货币符号、逗号、尾点
  function looksAmountish(t) {
    var s = String(t).replace(/\s/g, '');
    return /^[¥￥$]?[\d,]+\.?\d*$/.test(s);
  }

  // ---------- Tesseract ----------
  function ensureWorker() {
    if (worker) return Promise.resolve(worker);
    return new Promise(function (resolve, reject) {
      if (typeof Tesseract === 'undefined') {
        reject(new Error('识别引擎加载失败（网络被拦截），请刷新重试'));
        return;
      }
      showStatus('正在加载识别引擎（首次约 10MB，请稍候）…');
      setProgress(0.05);
      var attempt = 0;
      function tryCreate() {
        attempt++;
        Tesseract.createWorker('eng', 1, {
          logger: function (m) {
            if (m.status === 'recognizing text' && m.progress != null) setProgress(0.15 + m.progress * 0.8);
            else if (m.status === 'loading language traineddata' || m.status === 'initializing api') setProgress(0.1);
          }
        }).then(function (w) {
          return w.setParameters({
            tessedit_char_whitelist: '0123456789.,¥￥$元 '
          }).then(function () { return w; });
        }).then(function (w) {
          worker = w;
          setProgress(0);
          showStatus('');
          resolve(w);
        }).catch(function (e) {
          setProgress(0);
          if (attempt < 2) { showStatus('引擎加载中断，重试中…'); tryCreate(); }
          else reject(new Error('识别引擎加载失败：' + (e && e.message || e)));
        });
      }
      tryCreate();
    });
  }

  // 降采样画布用于 OCR（长边 ~1100）
  function makeOcrCanvas() {
    var maxSide = 1100;
    var r = Math.min(1, maxSide / Math.max(origW, origH));
    var c = document.createElement('canvas');
    c.width = Math.round(origW * r);
    c.height = Math.round(origH * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { canvas: c, ratio: r };
  }

  function runOcr() {
    if (ocrBusy) return;
    ocrBusy = true;
    ensureWorker().then(function (w) {
      showStatus('正在识别图中金额…');
      var oc = makeOcrCanvas();
      return w.recognize(oc.canvas).then(function (res) { return { res: res, ratio: oc.ratio }; });
    }).then(function (o) {
      var words = (o.res.data && o.res.data.words) || [];
      var raw = [];
      words.forEach(function (wd) {
        var text = (wd.text || '').trim();
        if (!text) return;
        var b = wd.bbox || {};
        raw.push({
          text: text,
          box: [Math.round(b.x0 / o.ratio), Math.round(b.y0 / o.ratio),
                Math.round((b.x1 - b.x0) / o.ratio), Math.round((b.y1 - b.y0) / o.ratio)],
          conf: typeof wd.confidence === 'number' ? wd.confidence / 100 : 0
        });
      });
      var items = mergeAmountItems(raw);
      // 过滤：仅保留置信度≥0.3 的金额候选，去掉 OCR 噪声
      amounts = items.filter(function (it) { return isAmount(it.text) && it.conf >= 0.3; });
      amounts = dedupeOverlap(amounts);
      selectedIdx = -1;
      manualBox = null;
      // 自动选中：优先带货币符号 → 其次带小数 → 再次置信度最高
      if (amounts.length > 0) {
        var bestIdx = 0, bestScore = -1;
        amounts.forEach(function (a, i) {
          var s = 0;
          if (/[¥￥$]/.test(a.text)) s += 100;
          if (/\.\d/.test(a.text)) s += 50;
          s += (a.conf || 0) * 100;
          if (s > bestScore) { bestScore = s; bestIdx = i; }
        });
        selectedIdx = bestIdx;
        var a = amounts[bestIdx];
        manualBox = { x: a.box[0], y: a.box[1], w: a.box[2], h: a.box[3] };
      }
      renderAmountList();
      draw();
      if (amounts.length === 0) {
        showStatus('未识别到金额，请手动框选目标数字。', 'err');
      } else if (amounts.length === 1) {
        showStatus('识别到 1 处金额，已自动选中。填新值后点「处理图片」。', 'ok');
      } else {
        showStatus('识别到 ' + amounts.length + ' 处金额，已自动选中最高匹配项。填新值后点「处理图片」。', 'ok');
      }
      updateInfo();
      ocrBusy = false;
    }).catch(function (e) {
      ocrBusy = false;
      showStatus('识别失败：' + (e && e.message || e), 'err');
    });
  }

  // 合并 OCR 拆开的金额片段
  function joinTexts(t1, t2) {
    var a = t1.replace(/ /g, ''), b = t2.replace(/ /g, '');
    var mx = Math.min(a.length, b.length);
    for (var ov = mx; ov > 0; ov--) {
      if (a.slice(-ov) === b.slice(0, ov)) return a + b.slice(ov);
    }
    return a + b;
  }
  function mergeAmountItems(items) {
    var merged = [], used = {};
    for (var i = 0; i < items.length; i++) {
      if (used[i]) continue;
      var cur = { text: items[i].text, box: items[i].box.slice(), conf: items[i].conf };
      var changed = true;
      while (changed) {
        changed = false;
        for (var j = 0; j < items.length; j++) {
          if (used[j] || j === i) continue;
          var b2 = items[j].box;
          var oy = Math.min(cur.box[1] + cur.box[3], b2[1] + b2[3]) - Math.max(cur.box[1], b2[1]);
          if (oy <= 0) continue;
          var gap = b2[0] - (cur.box[0] + cur.box[2]);
          var gapLimit = Math.max(50, cur.box[3] * 0.5);
          if (b2[0] >= cur.box[0] - 5 && gap < gapLimit) {
            var nt = joinTexts(cur.text, items[j].text);
            // 货币符号词不参与合并（保持框只含数字，符号原样保留）
            if (/^[¥￥$]/.test(cur.text) || /^[¥￥$]/.test(items[j].text)) continue;
            if (/^[\d,]+\.?\d*$/.test(nt)) {
              cur.box = [Math.min(cur.box[0], b2[0]), Math.min(cur.box[1], b2[1]),
                         Math.max(cur.box[0] + cur.box[2], b2[0] + b2[2]) - Math.min(cur.box[0], b2[0]),
                         Math.max(cur.box[1] + cur.box[3], b2[1] + b2[3]) - Math.min(cur.box[1], b2[1])];
              cur.text = nt;
              cur.conf = Math.min(cur.conf, items[j].conf);
              used[j] = true;
              changed = true;
            }
          }
        }
      }
      merged.push(cur);
    }
    return merged;
  }
  function dedupeOverlap(items) {
    items.sort(function (a, b) { return a.box[1] - b.box[1] || a.box[0] - b.box[0]; });
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var dup = false;
      for (var j = 0; j < out.length; j++) {
        var A = items[i].box, B = out[j].box;
        var ix = Math.max(0, Math.min(A[0] + A[2], B[0] + B[2]) - Math.max(A[0], B[0]));
        var iy = Math.max(0, Math.min(A[1] + A[3], B[1] + B[3]) - Math.max(A[1], B[1]));
        var inter = ix * iy;
        var small = Math.min(A[2] * A[3], B[2] * B[3]);
        if (small > 0 && inter / small > 0.6) { dup = true; break; }
      }
      if (!dup) out.push(items[i]);
    }
    return out;
  }

  // ---------- 画布交互 ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!img) return;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    amounts.forEach(function (a, i) {
      var bx = a.box[0] * scale, by = a.box[1] * scale;
      var bw = a.box[2] * scale, bh = a.box[3] * scale;
      ctx.strokeStyle = (i === selectedIdx) ? '#EA6668' : '#52C41A';
      ctx.lineWidth = (i === selectedIdx) ? 3 : 2;
      ctx.strokeRect(bx, by, bw, bh);
      if (i === selectedIdx) { ctx.fillStyle = 'rgba(234,102,104,0.12)'; ctx.fillRect(bx, by, bw, bh); }
    });
    if (drawing) {
      var d = drawing;
      var x = Math.min(d.sx, d.ex), y = Math.min(d.sy, d.ey);
      var w = Math.abs(d.ex - d.sx), h = Math.abs(d.ey - d.sy);
      ctx.strokeStyle = '#EA6668'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(234,102,104,0.15)'; ctx.fillRect(x, y, w, h);
    }
  }
  function fitCanvas() {
    if (!img) return;
    var maxW = Math.min(720, window.innerWidth - 24);
    var maxH = Math.min(560, window.innerHeight * 0.55);
    var r = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    scale = r;
    canvas.width = Math.round(img.naturalWidth * r);
    canvas.height = Math.round(img.naturalHeight * r);
    draw();
  }
  function loadFile(f) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      img = new Image();
      img.onload = function () {
        origW = img.naturalWidth; origH = img.naturalHeight;
        amounts = []; selectedIdx = -1; manualBox = null; drawing = null;
        editorArea.classList.remove('hidden');
        uploadZone.classList.add('have');
        resultCard.classList.add('hidden');
        fitCanvas();
        updateInfo();
        submitBtn.disabled = true;
        runOcr();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  }
  function canvasPos(e) {
    var r = canvas.getBoundingClientRect();
    var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: clientX - r.left, y: clientY - r.top };
  }
  canvas.addEventListener('mousedown', function (e) { startDraw(e); });
  canvas.addEventListener('mousemove', function (e) { moveDraw(e); });
  window.addEventListener('mouseup', function () { endDraw(); });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); startDraw(e); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); moveDraw(e); }, { passive: false });
  canvas.addEventListener('touchend', function (e) { e.preventDefault(); endDraw(); }, { passive: false });
  function startDraw(e) {
    if (!img) return;
    var p = canvasPos(e);
    isDown = true;
    drawing = { sx: p.x, sy: p.y, ex: p.x, ey: p.y };
  }
  function moveDraw(e) {
    if (!isDown || !drawing) return;
    var p = canvasPos(e);
    drawing.ex = p.x; drawing.ey = p.y;
    draw();
  }
  function endDraw() {
    if (!isDown) return;
    isDown = false;
    if (drawing) {
      var d = drawing;
      var x = Math.min(d.sx, d.ex), y = Math.min(d.sy, d.ey);
      var w = Math.abs(d.ex - d.sx), h = Math.abs(d.ey - d.sy);
      if (w > 6 && h > 6) {
        manualBox = { x: Math.round(x / scale), y: Math.round(y / scale), w: Math.round(w / scale), h: Math.round(h / scale) };
        selectedIdx = -1;
        renderAmountList();
      }
      drawing = null;
      draw(); updateInfo();
    }
  }

  // ---------- 列表/状态 ----------
  function renderAmountList() {
    amountList.innerHTML = '';
    if (amounts.length === 0) { amountArea.classList.add('hidden'); return; }
    amountArea.classList.remove('hidden');
    amounts.forEach(function (a, i) {
      var div = document.createElement('div');
      div.className = 'amount-item' + (i === selectedIdx ? ' active' : '');
      div.innerHTML = '<span class="tag">金额' + (i + 1) + '</span><span>' + a.text + '</span><span class="conf">' +
        Math.round((a.conf || 0) * 100) + '%</span>';
      div.addEventListener('click', function () {
        selectedIdx = (selectedIdx === i) ? -1 : i;
        if (selectedIdx >= 0) { var a2 = amounts[selectedIdx]; manualBox = { x: a2.box[0], y: a2.box[1], w: a2.box[2], h: a2.box[3] }; }
        else manualBox = null;
        renderAmountList(); draw(); updateInfo();
      });
      amountList.appendChild(div);
    });
  }
  function updateInfo() {
    if (selectedIdx >= 0) {
      var a = amounts[selectedIdx];
      boxInfo.innerHTML = '已选择目标：<b>' + a.text + '</b>';
      clearBtn.disabled = false;
    } else if (manualBox) {
      boxInfo.textContent = '已框选（原图坐标）: x=' + manualBox.x + ', y=' + manualBox.y + ', 宽=' + manualBox.w + ', 高=' + manualBox.h;
      clearBtn.disabled = false;
    } else {
      boxInfo.textContent = '尚未选择目标：点选识别出的金额或手动框选';
      clearBtn.disabled = true;
    }
    submitBtn.disabled = !img;
  }
  uploadZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) loadFile(f);

  // ---------- 图像分析（移植自服务端） ----------

  }

  function renderTextToMain(text, info) {

  // ---------- 主处理 ----------

    var ex0 = Math.max(0, targetBox.y - padTop);
    var ex1 = Math.min(origH, targetBox.y + targetBox.h + padBottom);
    var exBox = { x: Math.max(0, targetBox.x - 6), y: ex0, w: Math.min(origW - Math.max(0, targetBox.x - 6), targetBox.w + 12), h: ex1 - ex0 };

    var info = analyzeRegionCtx(exBox, targetBox.y + targetBox.h / 2);
    if (!info) {
      ctx = realCtx;
      throw new Error('定位区域内未检测到文字，请重新框选');
    }
    // 数字横向区兜底：符号剥离失败时，用目标框范围约束，保证新数字不压住左侧 ¥ 符号
    if (!info.strippedLeft) info.x0 = Math.max(info.x0, targetBox.x);
    if (!info.strippedRight) info.x1 = Math.min(info.x1, targetBox.x + targetBox.w);
    if (info.x1 - info.x0 < 2) { info.x0 = exBox.x; info.x1 = Math.min(exBox.x + exBox.w, targetBox.x + targetBox.w); }

    // 2. 擦除（只擦数字区 x>=info.x0，保留左侧货币符号等）
    //    高阈值主 mask + 低阈值抗锯齿边缘（邻域 2px 内）一并擦除
    var w = exBox.w, h = exBox.h;
    var imgData = oc.getImageData(exBox.x, exBox.y, w, h);
    var d = imgData.data;
    function nearMask(m, mw, mh, px, py, rad) {
      for (var dy = -rad; dy <= rad; dy++) for (var dx = -rad; dx <= rad; dx++) {
        var yy = py + dy, xx = px + dx;
        if (yy < 0 || xx < 0 || yy >= mh || xx >= mw) continue;
        if (m[yy * mw + xx]) return true;
      }
      return false;
    }
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      if ((exBox.x + x) < info.x0) continue;
      // 只擦主文字行（±2px），绝不波及上方/下方其他文字
      var absY = exBox.y + y;
      if (absY < exBox.y + info.bestStart - 2 || absY > exBox.y + info.bestEnd + 2) continue;
      var o = (y * w + x) * 4;
      var diff = Math.max(Math.abs(d[o] - info.bg[0]), Math.abs(d[o + 1] - info.bg[1]), Math.abs(d[o + 2] - info.bg[2]));
      var inMask = info.mask[y * w + x] === 1;
      var nearEdge = !inMask && diff > 20 && nearMask(info.mask, w, h, x, y, 2);
      if (inMask || nearEdge) {
        d[o] = info.bg[0]; d[o + 1] = info.bg[1]; d[o + 2] = info.bg[2];
      }
    }
    oc.putImageData(imgData, exBox.x, exBox.y);
    smoothMaskedCtx(oc, exBox, info.mask, info.x0, info.bestStart - 2, info.bestEnd + 2);

    // 3. 渲染新值
    renderRecord = null;
    renderTextToMain(newVal, info);
    if (renderRecord) {
      var rr = renderRecord;
      oc.font = rr.font;
      oc.textBaseline = 'alphabetic';
      var baseLine = rr.dstY + rr.m.baseY - rr.m.y0;
      if (rr.strokeW > 0) {
        oc.lineWidth = rr.strokeW; oc.lineJoin = 'round'; oc.strokeStyle = rr.color;
        oc.strokeText(rr.text, rr.dstX, baseLine);
      }
      oc.fillStyle = rr.color;
      oc.fillText(rr.text, rr.dstX, baseLine);
    }

    // 4. 回写显示画布
    ctx = realCtx;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    return off;
  }

  function smoothMaskedCtx(c, box, mask, keepLeftOf, keepY0, keepY1) {
    var w = box.w, h = box.h;
    var imgData = c.getImageData(box.x, box.y, w, h);
    var d = imgData.data;
    var out = new Uint8ClampedArray(d);
    for (var y = 2; y < h - 2; y++) for (var x = 2; x < w - 2; x++) {
      if (y < (keepY0 || 0) || y > (keepY1 == null ? h - 1 : keepY1)) continue; // 只平滑主文字行
      if ((box.x + x) < (keepLeftOf || 0)) continue; // 符号区不平滑
      var near = 0;
      for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) if (mask[(y + dy) * w + (x + dx)]) near++;
      if (mask[y * w + x] || near > 0) {
        var r = 0, g = 0, b = 0, n = 0;
        for (var dy2 = -3; dy2 <= 3; dy2++) for (var dx2 = -3; dx2 <= 3; dx2++) {
          var yy = y + dy2, xx = x + dx2;
          if (yy < 0 || xx < 0 || yy >= h || xx >= w) continue;
          if (mask[yy * w + xx]) continue;
          var o2 = (yy * w + xx) * 4;
          r += d[o2]; g += d[o2 + 1]; b += d[o2 + 2]; n++;
        }
        if (n > 0) {
          var oo = (y * w + x) * 4;
          out[oo] = r / n; out[oo + 1] = g / n; out[oo + 2] = b / n;
        }
      }
    }
    for (var i = 0; i < out.length; i++) d[i] = out[i];
    c.putImageData(imgData, box.x, box.y);
  }

  // ---------- 提交 ----------
  submitBtn.addEventListener('click', function () {
    if (!img) { showStatus('请先上传截图', 'err'); return; }
    var val = newValueEl.value.trim();
    if (!val) { showStatus('缺少新值：请在上方填写新金额', 'err'); return; }

    // 定位框：优先已选中目标，其次手动框选
    var box = null;
    if (selectedIdx >= 0) {
      var sb = amounts[selectedIdx].box;
      box = { x: sb[0], y: sb[1], w: sb[2], h: sb[3] };
    } else {
      box = manualBox;
    }
    if (!box) { showStatus('请先选择或框选目标数字', 'err'); return; }

    submitBtn.disabled = true;
    showStatus('处理中…');
    setTimeout(function () {
      try {
        var off = processImage(box, val);
        // 导出
        off.toBlob(function (blob) {
          if (!blob) { showStatus('导出失败，请重试', 'err'); submitBtn.disabled = false; return; }
          var url = URL.createObjectURL(blob);
          resultImg.src = url;
          downloadBtn.href = url;
          resultCard.classList.remove('hidden');
          showStatus('处理完成，见下方结果图。', 'ok');
          submitBtn.disabled = false;
        }, 'image/png');
      } catch (e) {
        showStatus('处理失败：' + (e && e.message || e), 'err');
        submitBtn.disabled = false;
      }
    }, 50);
  });

  redoBtn.addEventListener('click', function () {
    resultCard.classList.add('hidden');
    showStatus('');
    if (img) { draw(); }
  });
})();
</script>
</body>
